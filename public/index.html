<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newbhulekh Control</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Noto Sans Devanagari', sans-serif;
            background-color: #121212;
            color: #fff;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        #header {
            background: #1e1e1e;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            z-index: 10;
        }
        #status { font-weight: bold; font-size: 14px; }
        .live { color: #4CAF50; }
        .disconnected { color: #f44336; }
        button.btn {
            background: #7c3aed;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        /* SCROLLABLE & ZOOMABLE CONTAINER */
        #viewport-container {
            flex: 1;
            overflow: auto;
            position: relative;
            background: #000;
            -webkit-overflow-scrolling: touch;
        }
        #stream-image {
            display: block;
            width: 100%;
            height: auto;
            transform-origin: top left;
            cursor: crosshair;
        }
        /* BOTTOM ACTION BAR */
        #footer {
            background: #1e1e1e;
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #333;
            z-index: 10;
        }
        #footer span { font-size: 13px; color: #aaa; }
        #pdf-btn {
            background: #dc2626;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="header">
        <div><b>Live View</b> | <span id="status" class="disconnected">Connecting...</span></div>
        <button class="btn" onclick="location.reload()">Reload</button>
    </div>

    <!-- Yahin se aap page ko aaram se scroll aur pinch-zoom kar sakenge -->
    <div id="viewport-container">
        <img id="stream-image" alt="Live Stream">
    </div>

    <div id="footer">
        <span id="hint">Tap anywhere to click</span>
        <button id="pdf-btn" onclick="makePdf()">Get PDF & Close</button>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const wsProtocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
        const wsUrl = `${wsProtocol}${window.location.host}/ws?token=${token}`;

        const ws = new WebSocket(wsUrl);
        const img = document.getElementById('stream-image');
        const status = document.getElementById('status');
        const container = document.getElementById('viewport-container');

        ws.onopen = () => {
            status.textContent = 'Live';
            status.className = 'live';
        };

        ws.onclose = () => {
            status.textContent = 'Disconnected';
            status.className = 'disconnected';
        };

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data.type === 'frame') {
                img.src = 'data:image/jpeg;base64,' + data.image;
            } else if (data.type === 'closed') {
                alert('Session closed.');
                window.close();
            }
        };

        // Click coordinates mapping
        img.addEventListener('click', (e) => {
            const rect = img.getBoundingClientRect();
            const scaleX = img.naturalWidth / rect.width;
            const scaleY = img.naturalHeight / rect.height;

            const x = Math.round((e.clientX - rect.left) * scaleX);
            const y = Math.round((e.clientY - rect.top) * scaleY);

            ws.send(JSON.stringify({ type: 'click', x: x, y: y }));
        });

        function makePdf() {
            if(confirm("Kya aap PDF generate karna chahte hain?")) {
                ws.send(JSON.stringify({ type: 'make_pdf' }));
                document.getElementById('pdf-btn').innerText = "Generating PDF...";
                document.getElementById('pdf-btn').disabled = true;
            }
        }
    </script>
</body>
</html>
