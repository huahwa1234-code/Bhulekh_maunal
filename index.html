<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Telegram Web App JS SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bhulekh Control</title>
    <style>
        body, html { margin: 0; padding: 0; background-color: var(--tg-theme-bg-color, #121212); color: var(--tg-theme-text-color, #fff); font-family: sans-serif; overflow: hidden; height: 100%; touch-action: none; }
        #header { background: var(--tg-theme-secondary-bg-color, #333); padding: 10px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.5); z-index: 10; position: relative; }
        #status { font-size: 14px; font-weight: bold; color: #ff5252; }
        #status.connected { color: #69f0ae; }
        #viewer-container { width: 100%; height: calc(100vh - 100px); overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; position: relative; }
        #stream-img { display: block; width: 100%; height: auto; transform-origin: top left; }
        #footer { background: var(--tg-theme-secondary-bg-color, #222); display: flex; justify-content: space-between; padding: 10px; font-size: 14px; position: absolute; bottom: 0; width: 100%; box-sizing: border-box; }
        button { background: var(--tg-theme-button-color, #444); color: var(--tg-theme-button-text-color, #fff); border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:active { opacity: 0.8; }
        .pdf-btn { background: #e53935; }
    </style>
</head>
<body>
    <div id="header">
        <div>Live View</div>
        <div id="status">🔴 Offline</div>
        <button onclick="sendAction('refresh')">🔄 Reload</button>
    </div>
    
    <div id="viewer-container">
        <img id="stream-img" alt="Connecting to server...">
    </div>

    <div id="footer">
        <span style="align-self: center; font-size: 12px;">Tap keypad to search</span>
        <button class="pdf-btn" onclick="requestPdf()">📄 Get PDF & Close</button>
    </div>

    <script>
        // Telegram Web App Initialization
        const tg = window.Telegram.WebApp;
        tg.expand(); // Make it full screen
        tg.ready();

        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const statusEl = document.getElementById('status');
        const img = document.getElementById('stream-img');
        const container = document.getElementById('viewer-container');

        let ws;

        if (!token) {
            statusEl.innerText = '❌ Invalid';
            tg.showAlert('Session token missing!');
        } else {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws?token=${token}`;
            
            function connect() {
                ws = new WebSocket(wsUrl);

                ws.onopen = () => {
                    statusEl.innerText = '🟢 Live';
                    statusEl.className = 'connected';
                };

                ws.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    if (data.type === 'frame') {
                        img.src = 'data:image/jpeg;base64,' + data.image;
                    } else if (data.type === 'closed') {
                        tg.close(); // Close Web App automatically when session ends
                    }
                };

                ws.onclose = () => {
                    statusEl.innerText = '🔴 Offline';
                    statusEl.className = '';
                };
            }
            connect();

            // Touch mapping
            let touchStartX = 0, touchStartY = 0, isDragging = false;
            img.addEventListener('touchstart', (e) => {
                if(e.touches.length > 1) return;
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
                isDragging = false;
            });
            img.addEventListener('touchmove', (e) => {
                if (Math.abs(e.touches[0].clientX - touchStartX) > 10 || Math.abs(e.touches[0].clientY - touchStartY) > 10) {
                    isDragging = true;
                }
            });
            img.addEventListener('touchend', (e) => {
                if (isDragging || !ws || ws.readyState !== WebSocket.OPEN) return;
                const touch = e.changedTouches[0];
                const rect = img.getBoundingClientRect();
                const scaleX = img.naturalWidth / rect.width;
                const scaleY = img.naturalHeight / rect.height;
                const x = (touch.clientX - rect.left) * scaleX;
                const y = (touch.clientY - rect.top) * scaleY;
                ws.send(JSON.stringify({ type: 'click', x, y }));
            });
            let lastScrollTop = container.scrollTop;
            container.addEventListener('scroll', () => {
                if (!ws || ws.readyState !== WebSocket.OPEN) return;
                const deltaY = container.scrollTop - lastScrollTop;
                ws.send(JSON.stringify({ type: 'scroll', deltaY }));
                lastScrollTop = container.scrollTop;
            });
        }

        function sendAction(action) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: action }));
            }
        }

        function requestPdf() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'make_pdf' }));
                tg.close(); // Close the mini-app UI immediately, user will receive PDF in chat
            }
        }
    </script>
</body>
</html>
